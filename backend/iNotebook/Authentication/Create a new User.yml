info:
  name: Create a new User
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:5000/api/auth/createuser
  body:
    type: json
    data: |-
      {
        "name": "Anup Chaudhary",
        "email": "anup@gmail.com",
        "password": "12345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
